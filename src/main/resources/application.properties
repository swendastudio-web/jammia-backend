spring.application.name=jamia-backend

# Port: 8095 on this computer (8080 is used by another project).
# In production (AWS), set SERVER_PORT=8080.
server.port=${SERVER_PORT:8095}

# Database connection (PostgreSQL running in Docker, see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5435/jamia
spring.datasource.username=${DB_USERNAME:jamia}
spring.datasource.password=${DB_PASSWORD:jamia_dev_password}

# Flyway creates the tables; Hibernate only checks that entities match them
spring.jpa.hibernate.ddl-auto=validate

# Close the database session when the service finishes (not after the controller),
# so all database work stays inside the service layer.
spring.jpa.open-in-view=false

# Secret key used to sign login tokens (JWT). Must be at least 32 characters.
# The default is for local development only; set JWT_SECRET on a real server.
jamia.jwt.secret=${JWT_SECRET:dev-only-jamia-secret-key-change-me-in-production}

# How long tokens stay valid.
# Access token: sent with every request. Refresh token: used to get a new access token.
jamia.jwt.access-token-minutes=60
jamia.jwt.refresh-token-days=90

# Folder where profile photos are saved (on this server's disk; created automatically).
# Before production on AWS, photos should move to S3.
jamia.storage.profile-photos-dir=${PROFILE_PHOTOS_DIR:uploads/profile-photos}

# Largest upload Spring accepts (Spring's default is only 1 MB). Photos may be up to 5 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
